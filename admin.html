<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6feb">
  <title>Recitation Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background: #f4f6f9;
      color: #1f2937;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 4px;
      color: #2c3e50;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 16px;
      color: #64748b;
      text-align: center;
      font-size: 14px;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 5px;
    }

    input,
    select {
      padding: 10px;
      border: 1px solid #cbd5e1;
      margin-bottom: 10px;
    }

    button {
      padding: 11px;
      border: 0;
      background: #1f6feb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #e2e8f0;
      color: #1f2937;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .section {
      border-top: 1px solid #e5e7eb;
      margin-top: 16px;
      padding-top: 16px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 15px;
      color: #334155;
      font-weight: bold;
    }

    #result {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
    }

    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .loading {
      background: #e2e3e5;
      color: #383d41;
      border: 1px solid #d6d8db;
    }

    .student-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .student-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #f8fafc;
    }

    .student-name {
      font-weight: bold;
      color: #1f2937;
    }

    .student-meta {
      color: #64748b;
      font-size: 13px;
      margin-top: 3px;
    }

    .points {
      font-weight: bold;
      color: #155724;
      white-space: nowrap;
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Recitation Admin</h2>
    <p class="subtitle">Manage students and view section lists</p>

    <input type="password" id="pin" placeholder="Teacher PIN">

    <div class="section">
      <p class="section-title">Add / Edit Student</p>
      <input type="text" id="studentId" placeholder="Student ID">
      <input type="text" id="fullName" placeholder="Full Name">
      <input type="text" id="section" placeholder="Section">
      <div class="grid">
        <button id="addButton" type="button">Add Student</button>
        <button id="editButton" class="secondary" type="button">Save Edit</button>
      </div>
    </div>

    <div id="result"></div>

    <div class="section">
      <p class="section-title">View Students</p>
      <div class="grid">
        <select id="sectionFilter">
          <option value="">All sections</option>
        </select>
        <button id="refreshButton" class="secondary" type="button">Refresh List</button>
      </div>
      <div id="studentList" class="student-list"></div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw_p9PbNEfBxTCw2LamJ8aBxI9Y7-QUMCeNUAhrU3h0qu3CoUAqWGug3I4jORIzSY0U/exec";

    const pinInput = document.getElementById("pin");
    const studentIdInput = document.getElementById("studentId");
    const fullNameInput = document.getElementById("fullName");
    const sectionInput = document.getElementById("section");
    const addButton = document.getElementById("addButton");
    const editButton = document.getElementById("editButton");
    const refreshButton = document.getElementById("refreshButton");
    const sectionFilter = document.getElementById("sectionFilter");
    const studentList = document.getElementById("studentList");
    const resultDiv = document.getElementById("result");

    function showResult(type, message) {
      resultDiv.style.display = "block";
      resultDiv.className = type;
      resultDiv.innerText = message;
    }

    function callBackend(params) {
      return new Promise((resolve, reject) => {
        const callbackName = "adminCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");
        const query = new URLSearchParams({
          ...params,
          callback: callbackName,
          pin: pinInput.value.trim()
        });

        const timeoutId = setTimeout(() => {
          cleanup();
          reject(new Error("Backend request timed out."));
        }, 10000);

        function cleanup() {
          clearTimeout(timeoutId);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Could not reach Apps Script backend."));
        };

        script.src = WEB_APP_URL + "?" + query.toString();
        document.body.appendChild(script);
      });
    }

    async function runAdminAction(params) {
      if (!pinInput.value.trim()) {
        showResult("error", "Enter teacher PIN first.");
        pinInput.focus();
        return null;
      }

      showResult("loading", "Working...");

      try {
        const data = await callBackend(params);
        showResult(data.status === "success" ? "success" : "error", data.message || "Done.");
        return data;
      } catch (error) {
        showResult("error", "System Error: " + error.message);
        return null;
      }
    }

    async function loadSections() {
      const data = await runAdminAction({ action: "listSections" });

      if (!data || data.status !== "success") {
        return;
      }

      const currentValue = sectionFilter.value;
      sectionFilter.innerHTML = '<option value="">All sections</option>';

      data.sections.forEach((sectionName) => {
        const option = document.createElement("option");
        option.value = sectionName;
        option.innerText = sectionName;
        sectionFilter.appendChild(option);
      });

      sectionFilter.value = currentValue;
    }

    async function loadStudents() {
      const data = await runAdminAction({
        action: "listStudents",
        section: sectionFilter.value
      });

      if (!data || data.status !== "success") {
        return;
      }

      studentList.innerHTML = "";

      if (data.students.length === 0) {
        studentList.innerText = "No students found.";
        return;
      }

      data.students.forEach((student) => {
        const card = document.createElement("div");
        const details = document.createElement("div");
        const name = document.createElement("div");
        const meta = document.createElement("div");
        const points = document.createElement("div");

        card.className = "student-card";
        name.className = "student-name";
        meta.className = "student-meta";
        points.className = "points";

        name.innerText = student.fullName;
        meta.innerText = student.studentId + " | " + student.section;
        points.innerText = student.totalPoints + " pts";

        details.appendChild(name);
        details.appendChild(meta);
        card.appendChild(details);
        card.appendChild(points);

        card.addEventListener("click", () => {
          studentIdInput.value = student.studentId;
          fullNameInput.value = student.fullName;
          sectionInput.value = student.section;
        });

        studentList.appendChild(card);
      });
    }

    async function saveStudent(action) {
      const data = await runAdminAction({
        action,
        studentId: studentIdInput.value.trim(),
        fullName: fullNameInput.value.trim(),
        section: sectionInput.value.trim()
      });

      if (data && data.status === "success") {
        fullNameInput.value = "";
        sectionInput.value = "";
        await loadSections();
        await loadStudents();
      }
    }

    addButton.addEventListener("click", () => saveStudent("addStudent"));
    editButton.addEventListener("click", () => saveStudent("editStudent"));
    refreshButton.addEventListener("click", async () => {
      await loadSections();
      await loadStudents();
    });
    sectionFilter.addEventListener("change", loadStudents);
  </script>
</body>
</html>
